name: Daily update
on:
  schedule:
    - cron: "30 6 * * *"   # 07:30 UK during BST
  workflow_dispatch:
    inputs:
      dry_run:
        description: "1 = print digest instead of sending"
        default: ""
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q requests
      - name: Fetch results and rebuild (skip on plain push)
        if: github.event_name != 'push'
        env:
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
        run: |
          python -m scripts.fetch_results
          python -m scripts.build_leaderboard
      - name: Commit data changes
        if: github.event_name != 'push'
        run: |
          git config user.name "falcons-bot" && git config user.email "actions@github.com"
          git add data && git diff --cached --quiet || { git commit -m "data: daily update" && git push; }
      - name: Send WhatsApp digest
        if: github.event_name != 'push'
        env:
          GREENAPI_ID_INSTANCE: ${{ secrets.GREENAPI_ID_INSTANCE }}
          GREENAPI_TOKEN: ${{ secrets.GREENAPI_TOKEN }}
          WHATSAPP_GROUP_ID: ${{ secrets.WHATSAPP_GROUP_ID }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: |
          python -m scripts.digest
          git add data/digest_state.json && git diff --cached --quiet || { git commit -m "data: digest state" && git push; }
      - name: Build site artifact
        run: |
          git pull --rebase || true
          mkdir -p _site && cp site/* _site/ && cp -r data _site/data
      - uses: actions/upload-pages-artifact@v3
        with: { path: _site }
  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
