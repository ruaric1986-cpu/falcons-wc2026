name: Daily update
on:
  schedule:
    # GitHub frequently runs scheduled jobs late (we've seen 3-4h) or drops them,
    # so we fire several ticks across the morning instead of one. The `gate` job
    # lets exactly ONE through per day — the first tick at/after 07:30 UK that
    # GitHub actually runs — and the rest are quick no-ops. Covers 06:00-10:30 UTC,
    # which spans 07:30 UK in both BST and GMT.
    - cron: "*/30 6-10 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "1 = print digest instead of sending"
        default: ""
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.g.outputs.go }}
    steps:
      - uses: actions/checkout@v4
      - id: g
        env:
          EVENT: ${{ github.event_name }}
        run: |
          python - <<'PY'
          import os, json, datetime
          from zoneinfo import ZoneInfo
          event = os.environ.get("EVENT", "")
          go = True
          if event == "schedule":
              uk = datetime.datetime.now(ZoneInfo("Europe/London"))
              try:
                  with open("data/digest_state.json") as fh:
                      last = json.load(fh).get("last_sent")
              except FileNotFoundError:
                  last = None
              go = uk.time() >= datetime.time(7, 30) and last != uk.date().isoformat()
              print(f"schedule gate: uk={uk.isoformat()} last_sent={last} -> {'GO' if go else 'skip'}")
          else:
              print(f"event={event} -> GO")
          with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
              fh.write("go=1\n" if go else "go=\n")
          PY

  update:
    needs: gate
    if: needs.gate.outputs.go == '1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q requests
      - name: Fetch results and rebuild (skip on plain push)
        if: github.event_name != 'push'
        env:
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
        run: |
          python -m scripts.fetch_results
          python -m scripts.build_leaderboard
      - name: Commit data changes
        if: github.event_name != 'push'
        run: |
          git config user.name "falcons-bot" && git config user.email "actions@github.com"
          git add data && git diff --cached --quiet || { git commit -m "data: daily update" && git push; }
      - name: Send WhatsApp digest
        if: github.event_name != 'push'
        env:
          GREENAPI_ID_INSTANCE: ${{ secrets.GREENAPI_ID_INSTANCE }}
          GREENAPI_TOKEN: ${{ secrets.GREENAPI_TOKEN }}
          WHATSAPP_GROUP_ID: ${{ secrets.WHATSAPP_GROUP_ID }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: |
          python -m scripts.digest
          git add data/digest_state.json && git diff --cached --quiet || { git commit -m "data: digest state" && git push; }
      - name: Build site artifact
        run: |
          git pull --rebase || true
          mkdir -p _site && cp site/* _site/ && cp -r data _site/data
      - uses: actions/upload-pages-artifact@v3
        with: { path: _site }

  deploy:
    needs: [gate, update]
    if: needs.gate.outputs.go == '1'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
