name: Check WhatsApp instance
on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q requests
      - name: Query Green-API instance state
        env:
          GREENAPI_ID_INSTANCE: ${{ secrets.GREENAPI_ID_INSTANCE }}
          GREENAPI_TOKEN: ${{ secrets.GREENAPI_TOKEN }}
          GREENAPI_HOST: ${{ secrets.GREENAPI_HOST }}
        run: |
          python - <<'PY'
          import os, requests
          iid = os.environ["GREENAPI_ID_INSTANCE"]
          tok = os.environ["GREENAPI_TOKEN"]
          prefix = iid[:4]
          hosts = [
              "api.green-api.com",
              "api.greenapi.com",
              f"{prefix}.api.green-api.com",
              f"{prefix}.api.greenapi.com",
          ]
          for h in hosts:
              try:
                  r = requests.get(f"https://{h}/waInstance{iid}/getStateInstance/{tok}", timeout=20)
                  print(h, "->", r.status_code, r.text[:200])
              except Exception as e:
                  print(h, "-> ERR", repr(e)[:140])
          PY
