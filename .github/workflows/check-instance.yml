name: Check WhatsApp instance
on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q requests
      - name: Query Green-API instance state
        env:
          GREENAPI_ID_INSTANCE: ${{ secrets.GREENAPI_ID_INSTANCE }}
          GREENAPI_TOKEN: ${{ secrets.GREENAPI_TOKEN }}
          GREENAPI_HOST: ${{ secrets.GREENAPI_HOST }}
        run: |
          python - <<'PY'
          import os, requests
          host = os.environ.get("GREENAPI_HOST") or "api.green-api.com"
          iid = os.environ["GREENAPI_ID_INSTANCE"]
          tok = os.environ["GREENAPI_TOKEN"]
          r = requests.get(f"https://{host}/waInstance{iid}/getStateInstance/{tok}", timeout=30)
          print("getStateInstance:", r.status_code, r.text)
          PY
