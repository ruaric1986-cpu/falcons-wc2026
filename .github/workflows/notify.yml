name: One-off notify
on:
  workflow_dispatch:
    inputs:
      message:
        description: "Text message to send (used when no file_url is given)"
        required: false
      file_url:
        description: "Public URL of a file to attach (e.g. the sheet hosted on the site)"
        required: false
      file_name:
        description: "Filename to show in WhatsApp for the attachment"
        required: false
      caption:
        description: "Caption to accompany the attached file"
        required: false

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q requests
      - name: Send
        env:
          GREENAPI_ID_INSTANCE: ${{ secrets.GREENAPI_ID_INSTANCE }}
          GREENAPI_TOKEN: ${{ secrets.GREENAPI_TOKEN }}
          WHATSAPP_GROUP_ID: ${{ secrets.WHATSAPP_GROUP_ID }}
          MSG: ${{ inputs.message }}
          FILE_URL: ${{ inputs.file_url }}
          FILE_NAME: ${{ inputs.file_name }}
          CAPTION: ${{ inputs.caption }}
        run: |
          python - <<'PY'
          import os
          from scripts.send_whatsapp import send, send_file
          u = os.environ.get("FILE_URL")
          if u:
              send_file(u, os.environ.get("CAPTION", ""), os.environ.get("FILE_NAME") or "file")
          else:
              send(os.environ["MSG"])
          PY
